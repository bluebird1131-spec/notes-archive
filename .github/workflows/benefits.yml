name: benefits

on:
  schedule:
    - cron: '47 9 * * *' # 18:47 KST, before the 19:07 collection
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python tools/fetch_benefits.py
      - run: |
          git config user.name "bluebird1131-spec"
          git config user.email "260314975+bluebird1131-spec@users.noreply.github.com"
          git add data/benefits.json
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "benefits $(TZ=Asia/Seoul date +'%Y-%m-%d')"
            git pull --rebase && git push
          fi
